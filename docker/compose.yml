# Every published port binds to 127.0.0.1: the dev stack ships a known
# Postgres password, an unauthenticated Valkey and a mail catcher, none of
# which should be reachable from the rest of the network.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bagheera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bagheera}
      POSTGRES_DB: ${POSTGRES_DB:-bagheera}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres 18+ images expect the mount at /var/lib/postgresql itself
      # (not .../data) — they lay out a version-named subdir underneath so
      # pg_upgrade --link works across major versions later.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bagheera} -d ${POSTGRES_DB:-bagheera}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: dev
      args:
        # Exported by the Makefile from this host's own docker.sock gid —
        # required, no fallback: a bare `docker compose build` bypassing
        # the Makefile fails fast instead of silently baking in some other
        # host's gid (see Dockerfile.api's own comment).
        DOCKER_GID: ${DOCKER_GID:?}
    restart: unless-stopped
    # Migrate then start so `docker compose up` alone is enough — no
    # separate `db:migrate` step needed on a fresh checkout.
    command: sh -c "pnpm --filter api db:migrate && pnpm --filter api start:dev"
    env_file:
      - ../apps/api/.env
    environment:
      # pnpm's auto deps-status-check will otherwise try to interactively
      # confirm purging a stale node_modules volume — no TTY in a container.
      CI: "true"
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-bagheera}:${POSTGRES_PASSWORD:-bagheera}@postgres:5432/${POSTGRES_DB:-bagheera}
      VALKEY_URL: redis://valkey:6379
      EMAIL_SMTP_URL: smtp://mailpit:1025
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages:/app/packages
      - api_root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - api_money_node_modules:/app/packages/money/node_modules
      - api_reference_data_node_modules:/app/packages/reference-data/node_modules
      # Lets `pnpm test:integration` (Testcontainers) start its own
      # Postgres/Valkey containers on the host Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: dev
    restart: unless-stopped
    environment:
      # pnpm's auto deps-status-check will otherwise try to interactively
      # confirm purging a stale node_modules volume — no TTY in a container.
      CI: "true"
      # Container-network address of the api service, consumed by the
      # Vite dev-server proxy (see apps/web/vite.config.ts).
      API_PROXY_TARGET: http://api:3000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages:/app/packages
      - web_root_node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - web_money_node_modules:/app/packages/money/node_modules
      - web_reference_data_node_modules:/app/packages/reference-data/node_modules
    depends_on:
      - api

  # Runs apps/web's e2e suite against this stack, from a container — needed
  # because Playwright's Chromium build requires glibc (this repo's own web
  # dev image is Alpine/musl). Not part of the default `docker compose up`
  # set (profile-gated); invoke explicitly:
  #   docker compose exec api pnpm db:seed   # once, or whenever you want a clean DB
  #   docker compose --profile e2e run --rm playwright
  playwright:
    profiles: ["e2e"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.playwright
      args:
        # Exported by the Makefile from apps/web/package.json — required,
        # no fallback: a bare `docker compose build` bypassing the
        # Makefile fails fast instead of silently using some other
        # version's browser binaries.
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:?}
    # Shares web's network namespace so the app is reached on localhost:
    # http://web:5173 trips Vite's allowedHosts, and over plain HTTP
    # Chromium only stores Secure cookies for localhost. Other services stay
    # reachable by name.
    network_mode: "service:web"
    environment:
      # Not in web's namespace, so reached by service name.
      E2E_MAILPIT_HTTP_URL: http://mailpit:8025
      # Forwards the CI runner's CI=true so playwright.config.ts produces
      # the html report ci.yml uploads; empty locally.
      CI: ${CI:-}
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages:/app/packages
      - playwright_root_node_modules:/app/node_modules
      - playwright_node_modules:/app/apps/web/node_modules
      - playwright_money_node_modules:/app/packages/money/node_modules
      - playwright_reference_data_node_modules:/app/packages/reference-data/node_modules
    depends_on:
      - api
      - web
    command:
      - sh
      - -c
      - |
        until curl -sf http://api:3000/health >/dev/null; do sleep 2; done
        until curl -sf http://localhost:5173/ >/dev/null; do sleep 2; done
        # CI=true skips pnpm's interactive purge prompt, scoped to this
        # install so `pnpm e2e` still sees the real CI value.
        CI=true pnpm install --frozen-lockfile --filter web...
        pnpm e2e

volumes:
  postgres_data:
  valkey_data:
  # One set of node_modules volumes per service, packages/* included: each
  # Dockerfile installs `--filter <app>...`, so a shared volume would let
  # one service's tree overwrite another's (and playwright's are glibc
  # builds, web's musl).
  api_root_node_modules:
  web_root_node_modules:
  api_node_modules:
  web_node_modules:
  api_money_node_modules:
  web_money_node_modules:
  api_reference_data_node_modules:
  web_reference_data_node_modules:
  playwright_root_node_modules:
  playwright_node_modules:
  playwright_money_node_modules:
  playwright_reference_data_node_modules:
