services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bagheera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bagheera}
      POSTGRES_DB: ${POSTGRES_DB:-bagheera}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres 18+ images expect the mount at /var/lib/postgresql itself
      # (not .../data) — they lay out a version-named subdir underneath so
      # pg_upgrade --link works across major versions later.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bagheera} -d ${POSTGRES_DB:-bagheera}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: dev
    restart: unless-stopped
    # Migrate then start so `docker compose up` alone is enough — no
    # separate `db:migrate` step needed on a fresh checkout.
    command: sh -c "pnpm --filter api db:migrate && pnpm --filter api start:dev"
    env_file:
      - ../apps/api/.env
    environment:
      # pnpm's auto deps-status-check will otherwise try to interactively
      # confirm purging a stale node_modules volume — no TTY in a container.
      CI: "true"
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-bagheera}:${POSTGRES_PASSWORD:-bagheera}@postgres:5432/${POSTGRES_DB:-bagheera}
      VALKEY_URL: redis://valkey:6379
      EMAIL_SMTP_URL: smtp://mailpit:1025
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages:/app/packages
      - api_root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      # Lets `pnpm test:integration` (Testcontainers) reach the host Docker
      # daemon from inside this dev container to spin up its own ephemeral
      # Postgres/Valkey — dev-only, not present in compose.prod.yml.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: dev
    restart: unless-stopped
    environment:
      # pnpm's auto deps-status-check will otherwise try to interactively
      # confirm purging a stale node_modules volume — no TTY in a container.
      CI: "true"
      # Container-network address of the api service, consumed by the
      # Vite dev-server proxy (see apps/web/vite.config.ts).
      API_PROXY_TARGET: http://api:3000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ../apps/web:/app/apps/web
      - web_root_node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
    depends_on:
      - api

  # Runs apps/web's e2e suite against this stack, from a container — needed
  # because Playwright's Chromium build requires glibc (this repo's own web
  # dev image is Alpine/musl). Not part of the default `docker compose up`
  # set (profile-gated); invoke explicitly:
  #   docker compose exec api pnpm db:seed   # once, or whenever you want a clean DB
  #   docker compose --profile e2e run --rm playwright
  playwright:
    profiles: ["e2e"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.playwright
    # Shares the web container's network namespace instead of joining the
    # bridge network under its own hostname — visiting http://web:5173
    # (rather than genuine localhost) both trips Vite's allowedHosts guard
    # and, worse, makes Chromium refuse to store the Secure-flagged
    # session/CSRF cookies at all (only localhost/127.0.0.1 count as a
    # "potentially trustworthy origin" for that over plain HTTP) — every
    # mutating request 403s with no cookie ever persisting. Sharing web's
    # netns makes localhost:5173 genuinely reach it, matching the
    # already-proven host-run path exactly. Sibling services (api,
    # mailpit, ...) stay reachable by service name — DNS resolution comes
    # along with the shared netns, unaffected by ports/ any of that.
    network_mode: "service:web"
    environment:
      # mailpit isn't part of web's netns, so it still needs the
      # container-network hostname (unlike E2E_BASE_URL, left at its
      # localhost default — see network_mode above).
      E2E_MAILPIT_HTTP_URL: http://mailpit:8025
      # Docker doesn't forward host env vars into containers on its own —
      # without this, playwright.config.ts's `process.env.CI` check never
      # sees the CI runner's CI=true, the html reporter (and so
      # playwright-report/) never gets produced, and ci.yml's
      # upload-artifact step silently has nothing to upload. Empty locally
      # (not run from a shell with CI set), which is the correct "list
      # reporter only" behavior there too.
      CI: ${CI:-}
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages:/app/packages
      - playwright_root_node_modules:/app/node_modules
      - playwright_node_modules:/app/apps/web/node_modules
    depends_on:
      - api
      - web
    command:
      - sh
      - -c
      - |
        until curl -sf http://api:3000/health >/dev/null; do sleep 2; done
        until curl -sf http://localhost:5173/ >/dev/null; do sleep 2; done
        pnpm e2e

volumes:
  postgres_data:
  valkey_data:
  # Each service gets its own root node_modules volume — api and web's
  # deps/ trees differ now that each Dockerfile installs with `--filter
  # <app>...`, so sharing one volume let whichever container started
  # first silently win the other's dependency tree. playwright gets its
  # own for the same reason, and to keep its glibc-built native deps
  # (this image, unlike web's, isn't Alpine/musl) from mixing with web's.
  api_root_node_modules:
  web_root_node_modules:
  api_node_modules:
  web_node_modules:
  playwright_root_node_modules:
  playwright_node_modules:
