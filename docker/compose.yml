services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bagheera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bagheera}
      POSTGRES_DB: ${POSTGRES_DB:-bagheera}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres 18+ images expect the mount at /var/lib/postgresql itself
      # (not .../data) — they lay out a version-named subdir underneath so
      # pg_upgrade --link works across major versions later.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bagheera} -d ${POSTGRES_DB:-bagheera}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: dev
    restart: unless-stopped
    # Migrate then start so `docker compose up` alone is enough — no
    # separate `db:migrate` step needed on a fresh checkout.
    command: sh -c "pnpm --filter api db:migrate && pnpm --filter api start:dev"
    env_file:
      - ../apps/api/.env
    environment:
      # pnpm's auto deps-status-check will otherwise try to interactively
      # confirm purging a stale node_modules volume — no TTY in a container.
      CI: "true"
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-bagheera}:${POSTGRES_PASSWORD:-bagheera}@postgres:5432/${POSTGRES_DB:-bagheera}
      VALKEY_URL: redis://valkey:6379
      EMAIL_SMTP_URL: smtp://mailpit:1025
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages:/app/packages
      - api_root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: dev
    restart: unless-stopped
    environment:
      # pnpm's auto deps-status-check will otherwise try to interactively
      # confirm purging a stale node_modules volume — no TTY in a container.
      CI: "true"
      # Container-network address of the api service, consumed by the
      # Vite dev-server proxy (see apps/web/vite.config.ts).
      API_PROXY_TARGET: http://api:3000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ../apps/web:/app/apps/web
      - web_root_node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  valkey_data:
  # Each service gets its own root node_modules volume — api and web's
  # deps/ trees differ now that each Dockerfile installs with `--filter
  # <app>...`, so sharing one volume let whichever container started
  # first silently win the other's dependency tree.
  api_root_node_modules:
  web_root_node_modules:
  api_node_modules:
  web_node_modules:
