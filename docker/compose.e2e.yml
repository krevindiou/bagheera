# Override for docker/compose.yml, run under its own `-p <project>` (see
# the Makefile) so e2e gets separate containers, network and volumes and
# never touches dev data.
#
# No published ports: everything is reached over the project network, and
# none clash with a running dev stack.
services:
  postgres:
    ports: !reset []
  valkey:
    ports: !reset []
  mailpit:
    ports: !reset []
  api:
    ports: !reset []
    environment:
      # Short enough for idle-timeout.spec.ts to exercise a real expiry
      # without waiting out the 30-minute production default.
      SESSION_IDLE_TTL_SECONDS: "8"
  web:
    ports: !reset []
