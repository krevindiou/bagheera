services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bagheera}
      # No insecure fallback here (unlike USER/DB above): an unset
      # POSTGRES_PASSWORD must fail the container rather than silently
      # boot with a guessable password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-bagheera}
    # WAL archiving for scripts/backup.sh: archived segments land in
    # wal_archive, a host-visible volume the backup script also reads.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
      - -c
      - wal_level=replica
    volumes:
      # postgres 18+ images expect the mount at /var/lib/postgresql itself
      # (not .../data) — they lay out a version-named subdir underneath so
      # pg_upgrade --link works across major versions later.
      - postgres_data:/var/lib/postgresql
      # Bind mount (not a named volume) so scripts/backup.sh, running
      # directly on the host, can read the archived segments straight off
      # disk. Matches WAL_ARCHIVE_DIR's default there.
      - ${WAL_ARCHIVE_DIR:-/var/lib/bagheera/wal-archive}:/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bagheera} -d ${POSTGRES_DB:-bagheera}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.caddy
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
    name: bagheera_prod_postgres_data
  valkey_data:
    name: bagheera_prod_valkey_data
  caddy_data:
    name: bagheera_prod_caddy_data
  caddy_config:
    name: bagheera_prod_caddy_config
