name: GHCR namespace and login
description: Resolves the lowercase GHCR namespace, and optionally signs in to GHCR and sets up buildx.

inputs:
  login:
    description: Whether to sign in to GHCR, as `true` or `false`.
    default: 'true'
  buildx:
    description: Whether to set up buildx, as `true` or `false`.
    default: 'true'
  token:
    description: 'Token to sign in with; pushing needs the packages write permission.'
    default: ${{ github.token }}

outputs:
  namespace:
    description: ghcr.io/<owner>, lowercased.
    value: ${{ steps.registry.outputs.namespace }}

runs:
  using: composite
  steps:
    # GHCR names must be lowercase, and a fork's owner may not be.
    - id: registry
      run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      if: inputs.login == 'true'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      if: inputs.buildx == 'true'
