name: Write throwaway api .env
description: Writes an apps/api/.env with fake, non-secret values used only by CI test runs.

inputs:
  secret-suffix:
    description: Suffix appended to the SESSION_SECRET/CSRF_SECRET values, so runs stay distinguishable in logs.
    required: true

runs:
  using: composite
  steps:
    - run: |
        cat > apps/api/.env <<EOF
        CRYPTO_KEYS={"1":"8mJ0e7Z3vscIKX6Sp4hzw1tCTQiSVF0gzOREHMhYTYM="}
        CRYPTO_ACTIVE_KEY_ID=1
        SESSION_SECRET=${{ inputs.secret-suffix }}-session-secret
        CSRF_SECRET=${{ inputs.secret-suffix }}-csrf-secret
        APP_URL=http://localhost:5173
        RP_ID=localhost
        RP_NAME=Bagheera
        RP_ORIGIN=http://localhost:5173
        EMAIL_SMTP_URL=smtp://localhost:1025
        EMAIL_FROM=Bagheera <no-reply@bagheera.example>
        EOF
      shell: bash
