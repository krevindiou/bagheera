name: Setup pnpm workspace
description: Installs pnpm, Node.js (with pnpm store cache), and workspace dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
