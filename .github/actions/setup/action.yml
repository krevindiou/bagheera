name: Setup pnpm workspace
description: Installs pnpm, Node.js (with pnpm store cache), and workspace dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5
      with:
        package_json_file: package.json
    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # packages/* ship compiled output (dist/, gitignored) rather than
    # source — every consumer (api/web builds, lint's type-check, jest/
    # vitest, which all resolve @bagheera/money via its package.json
    # main/types, not a path-mapped alias to src/) needs it built first.
    # Building it once here, for every job that uses this action, mirrors
    # what docker/Dockerfile.api and docker/Dockerfile.caddy already do
    # for their production builds via `pnpm --filter <app>... build`.
    - run: pnpm --filter @bagheera/money build
      shell: bash
