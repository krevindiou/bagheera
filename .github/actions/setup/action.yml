name: Setup pnpm workspace
description: Installs pnpm, Node.js (with pnpm store cache), and workspace dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      with:
        package_json_file: package.json
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # packages/* resolve to their built dist/ (gitignored), which every
    # build, type-check and test needs first.
    - run: pnpm --filter @bagheera/money --filter @bagheera/reference-data build
      shell: bash
