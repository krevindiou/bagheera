name: Scan an image
description: Fails on a critical or high CVE that already has a fix, in an image built into the local daemon or in an already published one.

inputs:
  image:
    description: Image name, bagheera-api or bagheera-web.
    required: true
  build:
    description: Whether to build the image first, as `true` or `false`; `false` scans `image-ref`.
    default: 'true'
  image-ref:
    description: Image to scan when `build` is `false`.
    default: ''
  dockerfile:
    description: Dockerfile to build; required when `build` is `true`.
    default: ''
  arch:
    description: Architecture to build, amd64 or arm64; required when `build` is `true`.
    default: ''
  report:
    description: '`sarif` uploads the findings to the Security tab, `table` prints them in the job log.'
    default: table
  sarif-category:
    description: Code scanning category the SARIF report is uploaded under.
    default: ''
  cache-write:
    description: Whether to write the layer cache, as `true` or `false`.
    default: 'false'

runs:
  using: composite
  steps:
    # Loaded into the local daemon for the scan; a later push step reuses its
    # layer cache, so the image isn't built twice.
    - uses: ./.github/actions/build-image
      if: inputs.build == 'true'
      with:
        image: ${{ inputs.image }}
        dockerfile: ${{ inputs.dockerfile }}
        arch: ${{ inputs.arch }}
        cache-write: ${{ inputs.cache-write }}
        load: 'true'
        tags: ${{ inputs.image }}:scan
    # Unfixed CVEs can't be acted on. The SARIF format ignores `severity`
    # unless told otherwise.
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.build == 'true' && format('{0}:scan', inputs.image) || inputs.image-ref }}
        format: ${{ inputs.report }}
        output: ${{ inputs.report == 'sarif' && format('trivy-{0}.sarif', inputs.image) || '' }}
        limit-severities-for-sarif: true
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        trivyignores: .trivyignore
        exit-code: '1'
    # `always()` so a failing scan still reports what it found.
    - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      if: always() && inputs.report == 'sarif'
      with:
        sarif_file: trivy-${{ inputs.image }}.sarif
        category: ${{ inputs.sarif-category }}
