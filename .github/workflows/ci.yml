name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm --filter api exec tsc -p tsconfig.json --noEmit

  api-unit:
    name: API unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter api test

  web-unit:
    name: Web unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter web test

  api-integration:
    name: API integration tests
    runs-on: ubuntu-latest
    needs: api-unit
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter api test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [api-integration, web-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [api-integration, web-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter api build
      - run: pnpm --filter web build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [e2e, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      KAMAL_REGISTRY_SERVER: ${{ vars.KAMAL_REGISTRY_SERVER }}
      KAMAL_REGISTRY_USERNAME: ${{ vars.KAMAL_REGISTRY_USERNAME }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      API_IMAGE: ${{ vars.KAMAL_REGISTRY_SERVER }}/${{ vars.KAMAL_REGISTRY_USERNAME }}/bagheera-api:${{ github.sha }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VALKEY_URL: ${{ secrets.VALKEY_URL }}
      CRYPTO_KEYS: ${{ secrets.CRYPTO_KEYS }}
      CRYPTO_ACTIVE_KEY_ID: ${{ secrets.CRYPTO_ACTIVE_KEY_ID }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
      EMAIL_SMTP_URL: ${{ secrets.EMAIL_SMTP_URL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem install kamal --no-document --version "~> 2.12"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
      - run: mkdir -p ~/.ssh && ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Build and push the api accessory image
        run: |
          echo "$KAMAL_REGISTRY_PASSWORD" | docker login "$KAMAL_REGISTRY_SERVER" -u "$KAMAL_REGISTRY_USERNAME" --password-stdin
          docker build -f apps/api/Dockerfile -t "$API_IMAGE" .
          docker push "$API_IMAGE"
      - name: Boot or reboot the api accessory on a new image
        run: kamal accessory details api >/dev/null 2>&1 && kamal accessory reboot api || kamal accessory boot api
      - run: kamal deploy
