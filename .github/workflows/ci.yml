name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to main must not cancel a run that is publishing images:
  # it could leave one of the two pushed for a commit and not the other.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      # Each step is a root `check:*` script; `make check` (the `check` compose
      # service) runs the same ones, so a new check goes in package.json and
      # here by name only.
      - run: pnpm run check:lint
      - run: pnpm run check:format
      - run: pnpm run check:types
      - run: pnpm run check:specs
      - run: pnpm run check:hooks
      - run: pnpm run check:audit
      - run: pnpm run check:dedupe
      - run: pnpm run check:knip

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      # `<app>...` builds the app's packages/* dependencies first, as the
      # Dockerfiles do.
      - run: pnpm --filter api... build
      - run: pnpm --filter web... build

  api-unit:
    name: API unit tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter api test:cov
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: success() || failure()
        with:
          name: API Unit Test Report
          path: apps/api/junit-unit.xml
          reporter: java-junit
      - uses: ./.github/actions/coverage-summary
        if: success() || failure()
        with:
          path: apps/api/coverage/coverage-summary.json
          title: API unit test coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage/lcov.info
          flags: api-unit
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: apps/api/junit-unit.xml
          flags: api-unit

  web-unit:
    name: Web unit tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter web test:cov
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: success() || failure()
        with:
          name: Web Unit Test Report
          path: apps/web/junit-unit.xml
          reporter: java-junit
      - uses: ./.github/actions/coverage-summary
        if: success() || failure()
        with:
          path: apps/web/coverage/coverage-summary.json
          title: Web unit test coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/web/coverage/lcov.info
          flags: web-unit
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: apps/web/junit-unit.xml
          flags: web-unit

  money-unit:
    name: Money package unit tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter @bagheera/money test:cov
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: success() || failure()
        with:
          name: Money Package Unit Test Report
          path: packages/money/junit-unit.xml
          reporter: java-junit
      - uses: ./.github/actions/coverage-summary
        if: success() || failure()
        with:
          path: packages/money/coverage/coverage-summary.json
          title: Money package unit test coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/money/coverage/lcov.info
          flags: money-unit
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: packages/money/junit-unit.xml
          flags: money-unit

  reference-data-unit:
    name: Reference-data package unit tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter @bagheera/reference-data test:cov
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: success() || failure()
        with:
          name: Reference-data Package Unit Test Report
          path: packages/reference-data/junit-unit.xml
          reporter: java-junit
      - uses: ./.github/actions/coverage-summary
        if: success() || failure()
        with:
          path: packages/reference-data/coverage/coverage-summary.json
          title: Reference-data package unit test coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/reference-data/coverage/lcov.info
          flags: reference-data-unit
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: packages/reference-data/junit-unit.xml
          flags: reference-data-unit

  api-integration:
    name: API integration tests
    runs-on: ubuntu-latest
    needs: api-unit
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/write-api-test-env
        with:
          secret-suffix: integration
      - run: pnpm --filter api test:integration:cov
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: success() || failure()
        with:
          name: API Integration Test Report
          path: apps/api/junit-integration.xml
          reporter: java-junit
      - uses: ./.github/actions/coverage-summary
        if: success() || failure()
        with:
          path: apps/api/coverage-integration/coverage-summary.json
          title: API integration test coverage (services/controllers)
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage-integration/lcov.info
          flags: api-integration
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: apps/api/junit-integration.xml
          flags: api-integration

  # Disabled for now — re-enable by dropping `if: false`.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [api-integration, web-unit, money-unit, reference-data-unit]
    if: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/write-api-test-env
        with:
          secret-suffix: e2e
      - run: make test-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Pushes the production images to Docker Hub, where the deploy host pulls
  # them anonymously (docker/compose.prod.yml). Deploying is manual: roll out
  # one of these tags with `uc deploy`.
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    # Not `e2e`: while it is disabled (`if: false`) a skipped need would skip
    # this job too. Add it here when e2e comes back.
    needs: [api-integration, web-unit, money-unit, reference-data-unit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - image: bagheera-api
            dockerfile: docker/Dockerfile.api
          - image: bagheera-web
            dockerfile: docker/Dockerfile.caddy
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # QEMU lets the amd64 runner build the arm64 half of the image.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A multi-arch image can't be loaded into the local daemon, so Buildx
      # builds and pushes it in this one step.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
