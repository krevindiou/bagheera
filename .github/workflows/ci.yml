name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: pnpm lint:check
      - run: pnpm format:check
      - run: pnpm --filter api exec tsc -p tsconfig.json --noEmit
      - run: node scripts/check-integration-spec-coverage.mjs
      - run: pnpm audit --prod --audit-level=high

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      # api...  / web... : build api/web's workspace packages/* dependencies
      # first (topological order), then the app itself — pnpm run --filter
      # doesn't build a filtered package's dependencies on its own. Matches
      # docker/Dockerfile.api and docker/Dockerfile.caddy's production
      # build stages.
      - run: pnpm --filter api... build
      - run: pnpm --filter web... build

  api-unit:
    name: API unit tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter api test:cov
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: success() || failure()
        with:
          name: API Unit Test Report
          path: apps/api/junit-unit.xml
          reporter: java-junit
      - uses: ./.github/actions/coverage-summary
        if: success() || failure()
        with:
          path: apps/api/coverage/coverage-summary.json
          title: API unit test coverage

  web-unit:
    name: Web unit tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter web test:cov
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: success() || failure()
        with:
          name: Web Unit Test Report
          path: apps/web/junit-unit.xml
          reporter: java-junit
      - uses: ./.github/actions/coverage-summary
        if: success() || failure()
        with:
          path: apps/web/coverage/coverage-summary.json
          title: Web unit test coverage

  money-unit:
    name: Money package unit tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter @bagheera/money test:cov
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: success() || failure()
        with:
          name: Money Package Unit Test Report
          path: packages/money/junit-unit.xml
          reporter: java-junit
      - uses: ./.github/actions/coverage-summary
        if: success() || failure()
        with:
          path: packages/money/coverage/coverage-summary.json
          title: Money package unit test coverage

  reference-data-unit:
    name: Reference-data package unit tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter @bagheera/reference-data test:cov
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: success() || failure()
        with:
          name: Reference-data Package Unit Test Report
          path: packages/reference-data/junit-unit.xml
          reporter: java-junit
      - uses: ./.github/actions/coverage-summary
        if: success() || failure()
        with:
          path: packages/reference-data/coverage/coverage-summary.json
          title: Reference-data package unit test coverage

  api-integration:
    name: API integration tests
    runs-on: ubuntu-latest
    needs: api-unit
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/write-api-test-env
        with:
          secret-suffix: integration
      - run: pnpm --filter api test:integration:cov
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: success() || failure()
        with:
          name: API Integration Test Report
          path: apps/api/junit-integration.xml
          reporter: java-junit
      - uses: ./.github/actions/coverage-summary
        if: success() || failure()
        with:
          path: apps/api/coverage-integration/coverage-summary.json
          title: API integration test coverage (services/controllers)

  # Disabled for now — re-enable by dropping `if: false`.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [api-integration, web-unit, money-unit, reference-data-unit]
    if: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/write-api-test-env
        with:
          secret-suffix: e2e
      - run: make test-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: e2e
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      KAMAL_REGISTRY_SERVER: ${{ vars.KAMAL_REGISTRY_SERVER }}
      KAMAL_REGISTRY_USERNAME: ${{ vars.KAMAL_REGISTRY_USERNAME }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      API_IMAGE: ${{ vars.KAMAL_REGISTRY_SERVER }}/${{ vars.KAMAL_REGISTRY_USERNAME }}/bagheera-api:${{ github.sha }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VALKEY_URL: ${{ secrets.VALKEY_URL }}
      VALKEY_PASSWORD: ${{ secrets.VALKEY_PASSWORD }}
      CRYPTO_KEYS: ${{ secrets.CRYPTO_KEYS }}
      CRYPTO_ACTIVE_KEY_ID: ${{ secrets.CRYPTO_ACTIVE_KEY_ID }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
      EMAIL_SMTP_URL: ${{ secrets.EMAIL_SMTP_URL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
      - run: gem install kamal --no-document --version "~> 2.12"
      - name: Check .kamal/secrets env vars are set
        run: |
          missing=0
          for name in $(grep -oP '^\w+(?==\$\w+$)' .kamal/secrets); do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required by .kamal/secrets but is unset in the deploy job env"
              missing=1
            fi
          done
          exit "$missing"
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
      # Pinned, not ssh-keyscan'd: scanning on every run trusts whatever key
      # answers at connect time (a DNS/routing MITM would pass silently).
      # DEPLOY_HOST_KNOWN_HOSTS holds the host's own known_hosts line(s),
      # captured once out of band — see docs/backup-restore.md's "Deploy
      # host SSH setup" section for how to (re)generate it.
      - run: mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_HOST_KNOWN_HOSTS" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST_KNOWN_HOSTS: ${{ secrets.DEPLOY_HOST_KNOWN_HOSTS }}
      - name: Build and push the api accessory image
        run: |
          echo "$KAMAL_REGISTRY_PASSWORD" | docker login "$KAMAL_REGISTRY_SERVER" -u "$KAMAL_REGISTRY_USERNAME" --password-stdin
          docker build -f docker/Dockerfile.api -t "$API_IMAGE" .
          docker push "$API_IMAGE"
      - name: Run database migrations from the new image
        # Deliberately not --reuse: this spins up a one-off container from
        # the new $API_IMAGE without touching the still-running (old-image)
        # accessory, so the schema is up to date before any new code runs.
        run: kamal accessory exec api "node dist/db/migrate.js"
      - name: Boot or reboot the api accessory on the new image
        run: kamal accessory details api >/dev/null 2>&1 && kamal accessory reboot api || kamal accessory boot api
      - run: kamal deploy
