name: CI

# Docs-only changes skip it; the Release workflow calls it for the commit it
# releases, whatever changed, so a Markdown format error is caught there at
# the latest.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore: *docs
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Every main commit keeps its coverage upload: Codecov compares PRs against it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      # Each step is a root `check:*` script; `make check` (the `check` compose
      # service) runs the same ones, so a new check goes in package.json and
      # here by name only.
      - run: pnpm run check:lint
      - run: pnpm run check:format
      - run: pnpm run check:types
      - run: pnpm run check:specs
      - run: pnpm run check:hooks
      # The runner's own ShellCheck drifts with the image, and older versions
      # report findings newer ones don't: put a pinned one first on PATH, the
      # binary of the digest-pinned official image. Keep its version on the one
      # docker/Dockerfile.check gets from Alpine for `make check` (0.11.0).
      - name: Install ShellCheck 0.11.0
        run: |
          dir="$RUNNER_TEMP/shellcheck"
          mkdir -p "$dir"
          id=$(docker create koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d)
          docker cp "$id:/bin/shellcheck" "$dir/shellcheck"
          docker rm "$id" >/dev/null
          "$dir/shellcheck" --version
          echo "$dir" >>"$GITHUB_PATH"
      - run: pnpm run check:shellcheck
      - run: pnpm run check:image-age
      - run: pnpm run check:audit
      - run: pnpm run check:dedupe
      - run: pnpm run check:knip

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      # `<app>...` builds the app's packages/* dependencies first, as the
      # Dockerfiles do.
      - run: pnpm --filter api... build
      - run: pnpm --filter web... build

  unit:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API unit tests
            filter: api
            dir: apps/api
            flag: api-unit
            report: API Unit Test Report
            title: API unit test coverage
          - name: Web unit tests
            filter: web
            dir: apps/web
            flag: web-unit
            report: Web Unit Test Report
            title: Web unit test coverage
          - name: Money package unit tests
            filter: '@bagheera/money'
            dir: packages/money
            flag: money-unit
            report: Money Package Unit Test Report
            title: Money package unit test coverage
          - name: Reference-data package unit tests
            filter: '@bagheera/reference-data'
            dir: packages/reference-data
            flag: reference-data-unit
            report: Reference-data Package Unit Test Report
            title: Reference-data package unit test coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter '${{ matrix.filter }}' test:cov
      - uses: ./.github/actions/report-tests
        if: '!cancelled()'
        with:
          name: ${{ matrix.report }}
          title: ${{ matrix.title }}
          dir: ${{ matrix.dir }}
          flag: ${{ matrix.flag }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  api-integration:
    name: API integration tests
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/write-api-test-env
        with:
          secret-suffix: integration
      - run: pnpm --filter api test:integration:cov
      - uses: ./.github/actions/report-tests
        if: '!cancelled()'
        with:
          name: API Integration Test Report
          title: API integration test coverage (services/controllers)
          dir: apps/api
          flag: api-integration
          junit: junit-integration.xml
          coverage: coverage-integration
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  backup:
    name: Backup container tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: make test-backup

  postgres:
    name: Postgres image tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: make test-postgres
