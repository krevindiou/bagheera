name: CI

# Docs-only changes skip it; the Release workflow calls it for the commit it
# releases, whatever changed, so a Markdown format error is caught there at
# the latest.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore: *docs
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Every main commit keeps its coverage upload: Codecov compares PRs against it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      # Each step is a root `check:*` script; `make check` (the `check` compose
      # service) runs the same ones, so a new check goes in package.json and
      # here by name only.
      - run: pnpm run check:lint
      - run: pnpm run check:format
      - run: pnpm run check:types
      - run: pnpm run check:specs
      - run: pnpm run check:hooks
      - run: pnpm run check:audit
      - run: pnpm run check:dedupe
      - run: pnpm run check:knip

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      # `<app>...` builds the app's packages/* dependencies first, as the
      # Dockerfiles do.
      - run: pnpm --filter api... build
      - run: pnpm --filter web... build

  api-unit:
    name: API unit tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter api test:cov
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: success() || failure()
        with:
          name: API Unit Test Report
          path: apps/api/junit-unit.xml
          reporter: java-junit
      - uses: ./.github/actions/coverage-summary
        if: success() || failure()
        with:
          path: apps/api/coverage/coverage-summary.json
          title: API unit test coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage/lcov.info
          flags: api-unit
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: apps/api/junit-unit.xml
          flags: api-unit

  web-unit:
    name: Web unit tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter web test:cov
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: success() || failure()
        with:
          name: Web Unit Test Report
          path: apps/web/junit-unit.xml
          reporter: java-junit
      - uses: ./.github/actions/coverage-summary
        if: success() || failure()
        with:
          path: apps/web/coverage/coverage-summary.json
          title: Web unit test coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/web/coverage/lcov.info
          flags: web-unit
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: apps/web/junit-unit.xml
          flags: web-unit

  money-unit:
    name: Money package unit tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @bagheera/money test:cov
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: success() || failure()
        with:
          name: Money Package Unit Test Report
          path: packages/money/junit-unit.xml
          reporter: java-junit
      - uses: ./.github/actions/coverage-summary
        if: success() || failure()
        with:
          path: packages/money/coverage/coverage-summary.json
          title: Money package unit test coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/money/coverage/lcov.info
          flags: money-unit
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: packages/money/junit-unit.xml
          flags: money-unit

  reference-data-unit:
    name: Reference-data package unit tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @bagheera/reference-data test:cov
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: success() || failure()
        with:
          name: Reference-data Package Unit Test Report
          path: packages/reference-data/junit-unit.xml
          reporter: java-junit
      - uses: ./.github/actions/coverage-summary
        if: success() || failure()
        with:
          path: packages/reference-data/coverage/coverage-summary.json
          title: Reference-data package unit test coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/reference-data/coverage/lcov.info
          flags: reference-data-unit
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: packages/reference-data/junit-unit.xml
          flags: reference-data-unit

  api-integration:
    name: API integration tests
    runs-on: ubuntu-latest
    needs: api-unit
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/write-api-test-env
        with:
          secret-suffix: integration
      - run: pnpm --filter api test:integration:cov
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: success() || failure()
        with:
          name: API Integration Test Report
          path: apps/api/junit-integration.xml
          reporter: java-junit
      - uses: ./.github/actions/coverage-summary
        if: success() || failure()
        with:
          path: apps/api/coverage-integration/coverage-summary.json
          title: API integration test coverage (services/controllers)
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage-integration/lcov.info
          flags: api-integration
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: apps/api/junit-integration.xml
          flags: api-integration
