name: Release

# release-please keeps a "chore(main): release x.y.z" PR open from the
# Conventional Commits on main (release-check.yml tests it before it is
# merged); merging it tags vx.y.z and creates the GitHub release, then the jobs
# below test that commit and publish its images.
# Deploying is manual: roll one out with `make deploy TAG=x.y.z`.
on:
  push:
    branches: [main]

concurrency:
  group: release
  # Cancelling a publish could push one image of a version and not the other.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    # The fallback token is for forks, which have no app.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A PR or a tag pushed with GITHUB_TOKEN triggers no workflow, so the
      # release PR would get no checks: the app's token pushes it instead. The
      # jobs below hang off this job's outputs rather than a `push: tags` trigger.
      - id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The push that merges the release PR also runs CI on its own; this run is
  # the one publishing waits for.
  ci:
    name: CI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  e2e:
    name: End-to-end tests
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/e2e.yml

  images:
    name: Images
    needs: [release-please, ci, e2e]
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/image-build.yml
    with:
      publish: true
      version: ${{ needs.release-please.outputs.version }}
