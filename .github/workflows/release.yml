name: Release

# release-please keeps a "chore(main): release x.y.z" PR open from the
# Conventional Commits on main (release-check.yml tests it before it is
# merged); merging it tags vx.y.z and creates the GitHub release, then the jobs
# below test that commit and publish its images.
# Deploying is manual: roll one out with `make deploy TAG=x.y.z`.
on:
  push:
    branches: [main]

concurrency:
  group: release
  # Cancelling a publish could push one image of a version and not the other.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    # The fallback token is for forks, which have no app.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A PR or a tag pushed with GITHUB_TOKEN triggers no workflow, so the
      # release PR would get no checks: the app's token pushes it instead. The
      # jobs below hang off this job's outputs rather than a `push: tags` trigger.
      - id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The push that merges the release PR also runs CI on its own; this run is
  # the one publishing waits for.
  ci:
    name: CI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  e2e:
    name: End-to-end tests
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/e2e.yml

  # One job per image and architecture, each on a native runner: emulating
  # arm64 under QEMU took most of the publish time. Each pushes its image by
  # digest only; `publish` then tags both digests as one multi-arch image.
  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [ci, e2e]
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      matrix:
        image: [bagheera-api, bagheera-web]
        arch: [amd64, arm64]
        include:
          - image: bagheera-api
            dockerfile: docker/Dockerfile.api
          - image: bagheera-web
            dockerfile: docker/Dockerfile.caddy
          # amd64 keeps the Trivy category the images were scanned under
          # before arm64 got its own scan, and that image-scan.yml updates.
          - arch: amd64
            runner: ubuntu-24.04
            sarif-category-suffix: ''
          - arch: arm64
            runner: ubuntu-24.04-arm
            sarif-category-suffix: '-arm64'
    steps:
      # The build context is the checkout: no token left in it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # GHCR names must be lowercase, and a fork's owner may not be.
      - id: registry
        run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Fails the job, before anything is pushed, on a critical or high CVE
      # that already has a fix.
      - uses: ./.github/actions/scan-image
        with:
          image: ${{ matrix.image }}
          dockerfile: ${{ matrix.dockerfile }}
          arch: ${{ matrix.arch }}
          report: sarif
          sarif-category: trivy-${{ matrix.image }}${{ matrix.sarif-category-suffix }}
          cache-write: 'true'
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.registry.outputs.namespace }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # Links the package to this repository on GitHub.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
      # Matrix jobs can't return one output each, so every digest travels as
      # an empty file named after it.
      - run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [release-please, build]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [bagheera-api, bagheera-web]
    steps:
      - id: registry
        run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.image }}-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tag both architectures as one image
        working-directory: digests
        env:
          IMAGE: ${{ steps.registry.outputs.namespace }}/${{ matrix.image }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" "${refs[@]}"
