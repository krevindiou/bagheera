name: Docker

# Images are only published on a release (release.yml); this catches a broken
# Dockerfile earlier, on the changes most likely to break one. amd64 only, no
# push.
on:
  push:
    branches: [main]
    paths: &paths
      - 'docker/**'
      - '.dockerignore'
      - '.npmrc'
      - '.nvmrc'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '**/package.json'
      - '.github/workflows/docker.yml'
  pull_request:
    paths: *paths

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: bagheera-api
            dockerfile: docker/Dockerfile.api
          - image: bagheera-web
            dockerfile: docker/Dockerfile.caddy
          - image: bagheera-backup
            dockerfile: docker/Dockerfile.backup
          - image: bagheera-postgres
            dockerfile: docker/Dockerfile.postgres
    steps:
      # The build context is the checkout: no token left in it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Shares release.yml's amd64 cache; only main writes it, so a PR's
      # layers don't evict the release ones.
      - uses: ./.github/actions/build-image
        with:
          image: ${{ matrix.image }}
          dockerfile: ${{ matrix.dockerfile }}
          arch: amd64
          cache-write: ${{ github.event_name == 'push' }}
