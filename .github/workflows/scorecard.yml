name: Scorecard

# OpenSSF Scorecard: grades the repository's security practices. With
# `publish_results` the score goes to scorecard.dev, which only accepts
# public repositories.
on:
  branch_protection_rule:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the results to the Security tab.
      security-events: write
      # Publish the results to scorecard.dev (OIDC).
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
