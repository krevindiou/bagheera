name: Image scan

# Images are scanned when a release builds them (release.yml); this re-scans
# the published `latest` weekly, for CVEs disclosed since. A failed run means
# a fix exists: cut a release to pick it up.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [bagheera-api, bagheera-web, bagheera-backup, bagheera-postgres]
    steps:
      # For .trivyignore.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: registry
        uses: ./.github/actions/ghcr-login
        with:
          login: 'false'
          buildx: 'false'
      # Same category as release.yml's amd64 scan, so its alerts are updated
      # rather than duplicated. Trivy picks the amd64 half of the image.
      - uses: ./.github/actions/scan-image
        with:
          image: ${{ matrix.image }}
          build: 'false'
          image-ref: ${{ steps.registry.outputs.namespace }}/${{ matrix.image }}:latest
          report: sarif
          sarif-category: trivy-${{ matrix.image }}
