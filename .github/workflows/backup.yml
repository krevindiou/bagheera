name: Backup

on:
  # Temporarily disabled — re-enable by uncommenting the schedule trigger.
  # schedule:
  #   - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    name: Nightly database backup
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
      # Pinned, not ssh-keyscan'd — see the same step in ci.yml's deploy job.
      - run: mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_HOST_KNOWN_HOSTS" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST_KNOWN_HOSTS: ${{ secrets.DEPLOY_HOST_KNOWN_HOSTS }}
      - name: Run scripts/backup.sh on the deploy host
        env:
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.RESTIC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RESTIC_AWS_SECRET_ACCESS_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_CONTAINER: ${{ vars.BACKUP_POSTGRES_CONTAINER }}
        # The remote command is just `bash -s` — no secrets on it — so
        # nothing sensitive ever appears in this runner's or the deploy
        # host's own process list (`ps`/`/proc/<pid>/cmdline`). Every
        # secret instead travels over the piped stdin stream, exported
        # first, then scripts/backup.sh's own content appended after.
        # `env:` above (rather than splicing `${{ secrets.* }}` directly
        # into this script) also sidesteps having to shell-escape a
        # secret value that might itself contain a quote.
        run: |
          {
            printf 'export RESTIC_REPOSITORY=%q\n' "$RESTIC_REPOSITORY"
            printf 'export RESTIC_PASSWORD=%q\n' "$RESTIC_PASSWORD"
            printf 'export AWS_ACCESS_KEY_ID=%q\n' "$AWS_ACCESS_KEY_ID"
            printf 'export AWS_SECRET_ACCESS_KEY=%q\n' "$AWS_SECRET_ACCESS_KEY"
            printf 'export POSTGRES_PASSWORD=%q\n' "$POSTGRES_PASSWORD"
            printf 'export POSTGRES_CONTAINER=%q\n' "$POSTGRES_CONTAINER"
            cat scripts/backup.sh
          # Not root: a dedicated `backup` user in the deploy host's `docker`
          # group, which is enough to run `docker exec` against the postgres
          # container without widening what a leaked KAMAL_SSH_PRIVATE_KEY
          # can do. See docs/backup-restore.md's "Deploy host SSH setup".
          } | ssh backup@"$DEPLOY_HOST" 'bash -s'
