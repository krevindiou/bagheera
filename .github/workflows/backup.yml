name: Backup

on:
  # Temporarily disabled — re-enable by uncommenting the schedule trigger.
  # schedule:
  #   - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Nightly database backup
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      # Its own key, not the one used to deploy: on the deploy host this key is restricted
      # to one forced command (/usr/local/bin/backup.sh, with the restic and
      # Postgres configuration kept on the host in /etc/bagheera-backup.env),
      # so a leak lets someone start a backup and nothing else. See
      # docs/backup-restore.md's "Deploy host SSH setup".
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.BACKUP_SSH_PRIVATE_KEY }}
      # Pinned, not ssh-keyscan'd — see the same step in ci.yml's deploy job.
      - run: mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_HOST_KNOWN_HOSTS" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST_KNOWN_HOSTS: ${{ secrets.DEPLOY_HOST_KNOWN_HOSTS }}
      # No command and no stdin: the host runs its forced command whatever
      # is asked, and holds every secret it needs itself.
      - name: Run the backup on the deploy host
        run: ssh -o BatchMode=yes backup@"$DEPLOY_HOST" < /dev/null
