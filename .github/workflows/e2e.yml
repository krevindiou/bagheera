name: End-to-end tests

# Called by release.yml for the commit it releases, and by release-check.yml
# for the release pull request.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/write-api-test-env
        with:
          secret-suffix: e2e
      # The e2e containers run as uid 1000 (`node`), the runner checkout belongs to another uid.
      - run: chmod -R a+rwX apps packages
      - run: make test-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
