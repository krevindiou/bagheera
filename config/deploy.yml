# Kamal deploys the public edge container (docker/Dockerfile.caddy — the built SPA
# served by Caddy, which reverse-proxies API routes to the "api" accessory
# below so cookies stay same-origin). Kamal's own proxy terminates TLS and
# does the health-checked, zero-downtime container swap in front of it; the
# Caddyfile is told (via CADDY_SITE_ADDRESS below) not to also manage TLS.
#
# postgres/valkey/api run as accessories: fixed, Kamal-managed containers
# reachable by the edge container at their accessory name (e.g. "api:3000"),
# stable across every edge deploy. Kamal only builds/pushes/rolls the
# primary service (the edge image); the api accessory's image has to be
# built and pushed to the registry separately before `kamal accessory boot
# api` (see the deploy CI stage for the exact commands).
#
# Required at deploy time (see .kamal/secrets):
#   KAMAL_REGISTRY_PASSWORD, POSTGRES_PASSWORD, DATABASE_URL, VALKEY_URL,
#   VALKEY_PASSWORD, CRYPTO_KEYS, CRYPTO_ACTIVE_KEY_ID, SESSION_SECRET,
#   CSRF_SECRET, EMAIL_SMTP_URL, EMAIL_FROM
# Required as plain env (export before running kamal):
#   DEPLOY_HOST, APP_DOMAIN, KAMAL_REGISTRY_SERVER, KAMAL_REGISTRY_USERNAME,
#   API_IMAGE (registry/bagheera-api:<tag> pushed ahead of time)
# Optional (Sentry error reporting, off when unset):
#   SENTRY_DSN (api accessory, via .kamal/secrets), VITE_SENTRY_DSN (baked
#   into the edge image's web build)

service: bagheera-web

image: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>/bagheera-web

servers:
  web:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("APP_DOMAIN") %>
  healthcheck:
    path: /health
    interval: 3
    timeout: 5

registry:
  server: <%= ENV.fetch("KAMAL_REGISTRY_SERVER", "docker.io") %>
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  dockerfile: docker/Dockerfile.caddy
  context: "."
  args:
    VITE_SENTRY_DSN: <%= ENV.fetch("VITE_SENTRY_DSN", "") %>

env:
  clear:
    CADDY_SITE_ADDRESS: "http://:80"

accessories:
  # Container name Kamal gives this is "bagheera-web-postgres" — that's
  # what scripts/backup.sh's POSTGRES_CONTAINER should be set to. Its
  # "wal-archive" directory lands under Kamal's own host-side accessory
  # directory (`kamal accessory details postgres` shows the exact mounted
  # path) — set scripts/backup.sh's WAL_ARCHIVE_DIR to that.
  postgres:
    image: postgres:18-alpine
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    port: "127.0.0.1:5432:5432"
    cmd: >-
      postgres -c archive_mode=on
      -c archive_command="test ! -f /wal-archive/%f && cp %p /wal-archive/%f"
      -c wal_level=replica
    env:
      clear:
        POSTGRES_USER: bagheera
        POSTGRES_DB: bagheera
      secret:
        - POSTGRES_PASSWORD
    directories:
      # postgres 18+ images expect the mount at /var/lib/postgresql itself
      # (not .../data) — they lay out a version-named subdir underneath so
      # pg_upgrade --link works across major versions later.
      - data:/var/lib/postgresql
      - wal-archive:/wal-archive

  valkey:
    image: valkey/valkey:9-alpine
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    port: "127.0.0.1:6379:6379"
    cmd: sh -c 'exec valkey-server --requirepass "$VALKEY_PASSWORD"'
    env:
      secret:
        - VALKEY_PASSWORD
    directories:
      - data:/data

  api:
    image: <%= ENV.fetch("API_IMAGE") %>
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    port: "3000"
    env:
      clear:
        PORT: "3000"
        APP_URL: https://<%= ENV.fetch("APP_DOMAIN") %>
      secret:
        - DATABASE_URL
        - VALKEY_URL
        - VALKEY_PASSWORD
        - CRYPTO_KEYS
        - CRYPTO_ACTIVE_KEY_ID
        - SESSION_SECRET
        - CSRF_SECRET
        - EMAIL_SMTP_URL
        - EMAIL_FROM
        - SENTRY_DSN
