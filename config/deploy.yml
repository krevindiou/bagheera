# Kamal deploys the public edge container (docker/Dockerfile.caddy — the built
# SPA served by Caddy). Kamal's own proxy terminates TLS and does the
# health-checked, zero-downtime container swap in front of it; the Caddyfile
# is told (via CADDY_SITE_ADDRESS below) not to also manage TLS.
#
# The API is a second, independent Kamal app — see config/deploy.api.yml —
# sharing this app's kamal-proxy and hostname via path-based routing
# (/health, /api/*), not an accessory of this one and not proxied through
# Caddy at all anymore (kamal-proxy routes those paths to it directly,
# before Caddy ever sees them).
#
# postgres/valkey still run as accessories below: fixed, Kamal-managed
# containers reachable by the api app at their accessory name (e.g.
# "postgres:5432"), stable across every deploy of either app. A backing
# store restarting for a few seconds during its own `kamal accessory
# reboot` is fine; a live web process doing the same isn't — that
# distinction, not "shared vs. app-specific," is why these stay accessories
# while api doesn't.
#
# Required at deploy time (see .kamal/secrets):
#   KAMAL_REGISTRY_PASSWORD, POSTGRES_PASSWORD
# Required as plain env (export before running kamal):
#   DEPLOY_HOST, APP_DOMAIN, KAMAL_REGISTRY_SERVER, KAMAL_REGISTRY_USERNAME
# Optional (Sentry error reporting, off when unset):
#   VITE_SENTRY_DSN, baked into the edge image's web build

service: bagheera-web

image: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>/bagheera-web

servers:
  web:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("APP_DOMAIN") %>
  healthcheck:
    path: /health
    interval: 3
    timeout: 5

registry:
  server: <%= ENV.fetch("KAMAL_REGISTRY_SERVER", "docker.io") %>
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  dockerfile: docker/Dockerfile.caddy
  context: "."
  args:
    VITE_SENTRY_DSN: <%= ENV.fetch("VITE_SENTRY_DSN", "") %>

env:
  clear:
    CADDY_SITE_ADDRESS: "http://:80"
    # Read by the Caddyfile's security headers: HSTS, sent only here where
    # the site is always HTTPS; and the Sentry ingest origin the SPA's
    # Content-Security-Policy allows — the DSN's host, empty without one.
    HSTS_POLICY: "max-age=63072000; includeSubDomains"
    SENTRY_INGEST_ORIGIN: "<%= ENV.fetch("VITE_SENTRY_DSN", "")[%r{\Ahttps://[^@/]+@([^/]+)/}, 1]&.then { |host| "https://#{host}" } %>"

accessories:
  # Container name Kamal gives this is "bagheera-web-postgres" — that's
  # what scripts/backup.sh's POSTGRES_CONTAINER should be set to.
  #
  # No archive_mode/archive_command: WAL archiving without a periodic
  # pg_basebackup to replay it onto isn't point-in-time recovery, it's just
  # unbounded disk growth. Recovery point objective is the nightly pg_dump
  # in scripts/backup.sh — up to 24h of data — documented in
  # docs/backup-restore.md.
  postgres:
    # Pinned by digest so a floated `postgres:18-alpine` retag can't
    # silently change what production runs; Renovate's docker:pinDigests
    # preset (renovate.json) keeps this current as the tag moves.
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: bagheera
        POSTGRES_DB: bagheera
      secret:
        - POSTGRES_PASSWORD
    directories:
      # postgres 18+ images expect the mount at /var/lib/postgresql itself
      # (not .../data) — they lay out a version-named subdir underneath so
      # pg_upgrade --link works across major versions later.
      - data:/var/lib/postgresql

  valkey:
    # Pinned by digest — same reasoning as postgres above.
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    port: "127.0.0.1:6379:6379"
    # maxmemory bounds how much of the host an anonymous flood (sessions,
    # rate-limit counters) can take. noeviction makes Valkey refuse writes
    # past it instead of silently dropping keys: evicting would erase
    # rate-limit counters and lockouts, and BullMQ requires it anyway.
    # `kamal deploy` doesn't restart accessories — apply a change here with
    # `kamal accessory reboot valkey`.
    cmd: >-
      sh -c 'exec valkey-server --requirepass "$VALKEY_PASSWORD"
      --maxmemory 256mb --maxmemory-policy noeviction'
    env:
      secret:
        - VALKEY_PASSWORD
    directories:
      - data:/data
