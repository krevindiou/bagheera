# The API, its own Kamal app (a separate image, so not a role of
# config/deploy.yml). It shares the host's kamal-proxy and the web app's
# hostname, routed by `proxy.path_prefix`, so it stays same-origin. Being an
# app (not an accessory) gets it health-checked, zero-downtime deploys.
#
# Pass `-c config/deploy.api.yml` (see ci.yml) on every command: `kamal`
# alone targets config/deploy.yml.
#
# Unverified against a live deploy when added: check that pages, /api/* and
# /health all resolve, and that kamal-proxy didn't try to issue a second
# TLS cert for APP_DOMAIN (Let's Encrypt rate limits).
#
# Required at deploy time (see .kamal/secrets):
#   KAMAL_REGISTRY_PASSWORD, DATABASE_URL, VALKEY_URL, VALKEY_PASSWORD,
#   CRYPTO_KEYS, CRYPTO_ACTIVE_KEY_ID, SESSION_SECRET, CSRF_SECRET,
#   EMAIL_SMTP_URL, EMAIL_FROM
# Required as plain env (export before running kamal):
#   DEPLOY_HOST, APP_DOMAIN, KAMAL_REGISTRY_SERVER, KAMAL_REGISTRY_USERNAME
# Optional: SENTRY_DSN (off when unset)

service: bagheera-api

image: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>/bagheera-api

servers:
  api:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>

# This app's only role, so it must say so explicitly — Kamal's own default
# primary-role name is "web", which isn't this role's name.
primary_role: api

ssh:
  # Opt-in, same switch as config/deploy.yml's: the KAMAL_SSH_USER repo
  # variable, root while it is unset.
  user: <%= ENV["KAMAL_SSH_USER"].to_s.empty? ? "root" : ENV["KAMAL_SSH_USER"] %>

proxy:
  ssl: true
  host: <%= ENV.fetch("APP_DOMAIN") %>
  # The web app's hostname, told apart by path. /health is unprefixed (see
  # apps/api/src/main.ts), hence its own entry.
  path_prefix: "/health,/api"
  # The API's routes include the prefix; stripping it would 404 them all.
  strip_path_prefix: false
  healthcheck:
    path: /health
    interval: 3
    timeout: 5

registry:
  server: <%= ENV.fetch("KAMAL_REGISTRY_SERVER", "docker.io") %>
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  dockerfile: docker/Dockerfile.api
  context: "."

env:
  clear:
    PORT: "3000"
    APP_URL: https://<%= ENV.fetch("APP_DOMAIN") %>
    RP_ID: <%= ENV.fetch("APP_DOMAIN") %>
    RP_NAME: Bagheera
    APP_TIMEZONE: Europe/Paris
    RP_ORIGIN: https://<%= ENV.fetch("APP_DOMAIN") %>
  secret:
    - DATABASE_URL
    - VALKEY_URL
    - VALKEY_PASSWORD
    - CRYPTO_KEYS
    - CRYPTO_ACTIVE_KEY_ID
    - SESSION_SECRET
    - CSRF_SECRET
    - EMAIL_SMTP_URL
    - EMAIL_FROM
    - SENTRY_DSN
