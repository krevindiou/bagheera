# A second, independent Kamal app — not a "role" under config/deploy.yml's
# `servers:` (Kamal roles are multiple *processes of the same image*, e.g. a
# web + a job role; api is a genuinely separate image/Dockerfile/codebase
# from the web app). Two independent Kamal apps sharing one host share that
# host's single kamal-proxy instance automatically (the first `kamal deploy`
# to run installs it; this one just reuses it) — disambiguated by the
# `proxy.path_prefix` below rather than a second hostname, so the API stays
# on the same origin as the web app (cookies, CORS).
#
# Deployed with `-c config/deploy.api.yml` (or `-d api`, see ci.yml) on every
# command — `kamal` alone always targets config/deploy.yml.
#
# This replaces the api *accessory* config/deploy.yml used to carry: an
# accessory only ever gets `kamal accessory reboot` (hard stop-then-start,
# no health check, no overlap — see tech-debt.md #16). As its own app, `api`
# now gets Kamal's normal `kamal deploy`: boot the new container, wait for
# kamal-proxy's healthcheck below to pass, *then* swap traffic and stop the
# old one.
#
# UNVERIFIED AGAINST A LIVE DEPLOY as of the commit that added this file —
# multiple pieces of this config (path-prefix routing sharing web's
# hostname, the build/migrate/deploy command sequence in ci.yml) are built
# from Kamal's documented config surface but not proven against this app's
# actual host. Watch the first real deploy closely: confirm a plain page
# load (served by the *other* Kamal app, config/deploy.yml) and an API call
# under /api/* and a bare /health both still resolve correctly, and that
# kamal-proxy didn't attempt to reprovision a TLS cert for APP_DOMAIN (it
# already holds one from the web app; a second independent issuance
# attempt could hit Let's Encrypt's rate limit).
#
# Required at deploy time (see .kamal/secrets — shared with config/deploy.yml,
# same variable names):
#   KAMAL_REGISTRY_PASSWORD, DATABASE_URL, VALKEY_URL, VALKEY_PASSWORD,
#   CRYPTO_KEYS, CRYPTO_ACTIVE_KEY_ID, SESSION_SECRET, CSRF_SECRET,
#   EMAIL_SMTP_URL, EMAIL_FROM
# Required as plain env (export before running kamal):
#   DEPLOY_HOST, APP_DOMAIN, KAMAL_REGISTRY_SERVER, KAMAL_REGISTRY_USERNAME
# Optional: SENTRY_DSN (off when unset)

service: bagheera-api

image: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>/bagheera-api

servers:
  api:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>

# This app's only role, so it must say so explicitly — Kamal's own default
# primary-role name is "web", which isn't this role's name.
primary_role: api

proxy:
  ssl: true
  host: <%= ENV.fetch("APP_DOMAIN") %>
  # Same origin as the web app (config/deploy.yml's own proxy.host) — the
  # two apps' kamal-proxy entries for that one hostname are disambiguated by
  # path instead. /health stays unprefixed (see apps/api/src/main.ts's
  # setGlobalPrefix: Dockerfile.api's own HEALTHCHECK and docker-compose.yml
  # both curl it unprefixed too), so it needs its own prefix entry alongside
  # /api itself.
  path_prefix: "/health,/api"
  # Without this, kamal-proxy strips the prefix before forwarding — every
  # route the API actually registers (under /api, plus bare /health) would
  # 404 with it stripped.
  strip_path_prefix: false
  healthcheck:
    path: /health
    interval: 3
    timeout: 5

registry:
  server: <%= ENV.fetch("KAMAL_REGISTRY_SERVER", "docker.io") %>
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  dockerfile: docker/Dockerfile.api
  context: "."

# Unchanged from the api accessory this replaces (config/deploy.yml, before
# this commit) — same env, same secrets.
env:
  clear:
    PORT: "3000"
    APP_URL: https://<%= ENV.fetch("APP_DOMAIN") %>
    RP_ID: <%= ENV.fetch("APP_DOMAIN") %>
    RP_NAME: Bagheera
    APP_TIMEZONE: Europe/Paris
    RP_ORIGIN: https://<%= ENV.fetch("APP_DOMAIN") %>
  secret:
    - DATABASE_URL
    - VALKEY_URL
    - VALKEY_PASSWORD
    - CRYPTO_KEYS
    - CRYPTO_ACTIVE_KEY_ID
    - SESSION_SECRET
    - CSRF_SECRET
    - EMAIL_SMTP_URL
    - EMAIL_FROM
    - SENTRY_DSN
