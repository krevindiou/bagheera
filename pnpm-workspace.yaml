packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  # Remove when @nestjs/platform-express pins multer >=2.5.0 and passes the release-age gate.
  multer: '>=2.5.0' # GHSA-q7qp-rjg7-q26m (high)
  # Remove when express depends on qs >=6.16.2.
  qs: '>=6.16.2' # CVE-2026-110910 (moderate)
  # Remove when drizzle-kit depends on esbuild >=0.28.1.
  'drizzle-kit>esbuild': '>=0.28.1' # SNYK-JS-ESBUILD-17750822 (critical)
  # Remove when drizzle-kit stops depending on @esbuild-kit.
  '@esbuild-kit/core-utils>esbuild': '>=0.28.1' # GHSA-67mh-4wv8-2f99 (moderate), SNYK-JS-ESBUILD-17750822 (critical)
  # Remove when archiver-utils, js-beautify and @sentry/bundler-plugins depend on glob >=14.0.2.
  'glob@>=9.0.0 <14.0.2': '^14.0.2' # GHSA-3g3m-2fjr-6pw4 (moderate)
  # Remove when eslint, @nestjs/cli, typescript-estree and readdir-glob depend on minimatch >=11.0.1.
  'minimatch@<11.0.1': '^11.0.1' # GHSA-g3hv-75wg-m249 (moderate), SNYK-JS-MINIMATCH-22111072 (medium)
peerDependencyRules:
  allowedVersions:
    # Remove when openapi-typescript supports TypeScript 6.
    'openapi-typescript>typescript': '6'
allowBuilds:
  '@scarf/scarf': false # telemetry postinstall, not needed
  '@swc/core': true # native compiler binary, needed by unplugin-swc (apps/api's Vitest decorator-metadata plugin)
  cpu-features: false # optional ssh2 perf opt; its node-gyp build fails without a toolchain, ssh2 falls back to JS
  esbuild: true
  msgpackr-extract: true # native perf opt, has JS fallback either way
  protobufjs: false # codegen only, not needed at runtime
  ssh2: true # testcontainers' docker exec/tunnel transport
  unrs-resolver: true
  vue-demi: true
