packages:
  - "apps/*"
  - "packages/*"
overrides:
  # Both are transitive; direct upgrade of the parent isn't available yet.
  '@nestjs/swagger>js-yaml': '>=5.2.2' # GHSA-pm4m-ph32-ghv5 (high, ReDoS)
  '@esbuild-kit/core-utils>esbuild': '>=0.24.3' # GHSA-67mh-4wv8-2f99 (moderate)
  # Transitive via express>body-parser>qs; direct upgrade of the parent
  # isn't available yet. Clears GHSA-4mjr-xmp4-gh2g (high, DoS via
  # attacker-controlled isBuffer) and GHSA-x5fp-wj9c-mxmx (moderate,
  # array-limit bypass).
  qs: '>=6.16.0'
  # Transitive on both sides, neither a runtime path: api's chain is
  # rooted in @nestjs/cli (devDependency, stripped by `pnpm deploy --prod`
  # — never in the runtime image); web's is rooted in vue-router's own
  # `unplugin`/webpack-based codegen plugin (a real `dependencies` entry,
  # per `pnpm why fast-uri`, but this app never imports that codegen
  # entry point, so Vite never bundles it into the shipped browser JS).
  # Clears 4 high advisories (SSRF/host-confusion via URL parsing):
  # GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf,
  # GHSA-jqff-g426-hqxp.
  fast-uri: '>=3.1.6'
allowBuilds:
  '@scarf/scarf': false # telemetry postinstall, not needed
  argon2: true
  cpu-features: true # native ssh2 perf opt, used by testcontainers
  esbuild: true
  msgpackr-extract: true # native perf opt, has JS fallback either way
  protobufjs: false # codegen only, not needed at runtime
  ssh2: true # testcontainers' docker exec/tunnel transport
  unrs-resolver: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@4.1.11'
  - '@vitest/expect@4.1.11'
  - '@vitest/mocker@4.1.11'
  - '@vitest/pretty-format@4.1.11'
  - '@vitest/runner@4.1.11'
  - '@vitest/snapshot@4.1.11'
  - '@vitest/spy@4.1.11'
  - '@vitest/utils@4.1.11'
  - vitest@4.1.11
